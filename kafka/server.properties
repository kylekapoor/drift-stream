# Single-node Kafka in KRaft mode -- broker and controller in one process, no
# ZooKeeper. Kafka 4.x removed ZooKeeper entirely, so this is the only mode.
#
# Everything is scoped to this repo (log.dirs below) so starting the broker
# never touches a system-wide Kafka install or leaves state outside the project.
process.roles=broker,controller
node.id=1
controller.quorum.bootstrap.servers=localhost:9093

listeners=PLAINTEXT://:9092,CONTROLLER://:9093
advertised.listeners=PLAINTEXT://localhost:9092
inter.broker.listener.name=PLAINTEXT
controller.listener.names=CONTROLLER
listener.security.protocol.map=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT

log.dirs=kafka/data

# Single node: nothing to replicate to.
offsets.topic.replication.factor=1
transaction.state.log.replication.factor=1
transaction.state.log.min.isr=1
share.coordinator.state.topic.replication.factor=1
share.coordinator.state.topic.min.isr=1
num.partitions=4

# Latency over throughput. The default 100 ms linger batches messages and would
# dominate the tick-to-decision measurement this project exists to make.
log.flush.interval.messages=10000
group.initial.rebalance.delay.ms=0
